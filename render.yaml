services:
  - type: web
    name: thiruvalluvar-tamil-quiz
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
